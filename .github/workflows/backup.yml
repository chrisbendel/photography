name: Backup content to git

# Content lives in D1 + R2 now, so git is no longer the source of truth. This
# keeps it as a complete restore point: every night it regenerates the markdown
# folders under backups/ and commits any change. Restoring means copying
# backups/photos/ to src/content/photos/ and reverting the D1 loader.
on:
  schedule:
    - cron: "17 9 * * *" # nightly, a few minutes past the hour
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - run: yarn install --immutable

      - name: Export D1 + R2 to markdown
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
          CLOUDFLARE_D1_TOKEN: ${{ secrets.CLOUDFLARE_D1_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: yarn export-to-git

      - name: Commit if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backups
          if git diff --staged --quiet; then
            echo "No content changes."
          else
            git commit -m "Back up content from D1/R2"
            git push
          fi
